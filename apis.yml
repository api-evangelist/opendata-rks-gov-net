aid: opendata-rks-gov-net
name: opendata.rks-gov.net (Kosovo Open Data) [offline]
description: >-
  opendata.rks-gov.net (RKS Open Data) was the national government open-data portal for the Republic of
  Kosovo, historically running CKAN (~v2.7). As of mid-2025 the hostname no longer resolves (NXDOMAIN) and
  the portal is offline; the last Internet Archive snapshots are from June 2025. It is cataloged here as
  historical pending restoration. Sectoral government open-data services remain available (e.g. Kosovo
  Customs at dogana.rks-gov.net/OpenData and the national geoportal at geoportal.rks-gov.net).
